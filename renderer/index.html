<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>russificator.kg</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app-version" class="version-badge"></div>

  <main class="screen" id="screen-login">
    <h1>russificator.kg</h1>
    <p class="subtitle">Вход в систему</p>
    <button id="telegram-login-btn" class="primary-btn">Войти через Telegram</button>
    <p id="login-status" class="status"></p>
  </main>

  <main class="screen" id="screen-waiting" hidden>
    <h1>russificator.kg</h1>
    <div class="spinner"></div>
    <p class="subtitle" id="waiting-text">Ожидание подтверждения администратора...</p>
    <button id="cancel-login-btn" class="secondary-btn">Отменить</button>
  </main>

  <main class="screen" id="screen-rejected" hidden>
    <h1>russificator.kg</h1>
    <p class="subtitle">В доступе отказано администратором.</p>
    <button id="retry-login-btn" class="secondary-btn">Попробовать снова</button>
  </main>

  <main class="screen" id="screen-main" hidden>
    <button id="admin-open-btn" class="admin-icon-btn" hidden title="Админ-панель">⚙</button>
    <h1>russificator.kg</h1>
    <p class="subtitle">Русификация автомобилей</p>

    <div id="car-picker">
      <button id="car-dropdown-btn" class="primary-btn">Выбрать марку/модель</button>
      <div id="car-dropdown-list" class="dropdown-list" hidden></div>
    </div>

    <div id="active-session" hidden>
      <p class="subtitle">Открыта работа с: <strong id="active-session-label"></strong></p>
    </div>

    <p id="status" class="status"></p>

    <button id="finish-session-btn" class="finish-btn" hidden>Завершено</button>
  </main>

  <main class="screen" id="screen-admin" hidden>
    <div class="admin-header">
      <button id="admin-back-btn" class="secondary-btn admin-back">← Назад</button>
      <div class="admin-tabs">
        <button id="admin-tab-history" class="admin-tab-btn active">История</button>
        <button id="admin-tab-users" class="admin-tab-btn">Пользователи</button>
      </div>
    </div>

    <section id="admin-history">
      <div id="admin-calendar"></div>
      <div id="admin-sessions-list"></div>
    </section>

    <section id="admin-users" hidden>
      <div id="admin-users-list"></div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
